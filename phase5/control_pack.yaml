completion_standard:
  target:
    - all five venues are fairly rehabilitated toward primary_fill candidacy
    - the default intended end state is all five venues rightfully promoted as primary_fill
    - final topology is judged on true multi-venue fill behavior, not only operational cleanliness
  hard_requirements:
    - no venue remains excluded solely because of unresolved known connector or platform defects
    - each venue must either reach primary_fill candidacy or be explicitly disproven with venue-local evidence
    - at least two non-Hyperliquid venues must demonstrate non-zero fill participation in reopened qualification before any new closeout is considered
    - Extended must either reach primary_fill candidacy or be explicitly disproven after a dedicated rescue program
    - all five venues must be execution-eligible on one integrated surface before the reopened long soak can begin
    - all five venues must be FV-eligible on the integrated surface before final closeout can be considered
    - final long soak must be operationally clean and strategically credible as a multi-venue execution surface
