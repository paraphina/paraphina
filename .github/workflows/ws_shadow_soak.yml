name: ws-shadow-soak

on:
  schedule:
    - cron: "0 4 * * 6"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Soak duration in minutes"
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "90"
      lighter_ping_interval_ms:
        description: "PARAPHINA_LIGHTER_PING_INTERVAL_MS"
        required: true
        default: "10000"
      extended_ws_read_timeout_ms:
        description: "PARAPHINA_EXTENDED_WS_READ_TIMEOUT_MS"
        required: true
        default: "45000"
      paradex_public_feed:
        description: "PARAPHINA_PARADEX_PUBLIC_FEED"
        required: true
        default: "bbo"
        type: choice
        options:
          - "bbo"
          - "orderbook"
      extended_ws_depth_levels:
        description: "PARAPHINA_EXTENDED_WS_DEPTH_LEVELS"
        required: true
        default: "2"
      hl_l2_levels:
        description: "HL_L2_LEVELS"
        required: true
        default: "20"
      hl_ts_hardening:
        description: "PARAPHINA_HL_TS_HARDENING (0/1)"
        required: true
        default: "0"
      hl_ts_max_past_skew_ms:
        description: "PARAPHINA_HL_TS_MAX_PAST_SKEW_MS"
        required: true
        default: "1500"
      hl_ts_max_future_skew_ms:
        description: "PARAPHINA_HL_TS_MAX_FUTURE_SKEW_MS"
        required: true
        default: "250"
      extended_apply_age_on_any_l2:
        description: "PARAPHINA_EXTENDED_APPLY_AGE_ON_ANY_L2"
        required: true
        default: "0"
        type: string
      arb_extended_max_apply_age_ms:
        description: "PARAPHINA_ARB_EXTENDED_MAX_APPLY_AGE_MS"
        required: false
        default: ""
        type: string
      connectors:
        description: "Connector list passed to --connectors"
        required: true
        default: "hyperliquid,lighter,extended,aster,paradex"

permissions:
  contents: read

concurrency:
  group: ws-shadow-soak
  cancel-in-progress: false

jobs:
  shadow-soak:
    runs-on: ubuntu-latest
    env:
      PARAPHINA_EXTENDED_APPLY_AGE_ON_ANY_L2: ${{ inputs.extended_apply_age_on_any_l2 }}
      HL_L2_LEVELS: ${{ inputs.hl_l2_levels }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare output directory
        shell: bash
        run: |
          OUT_DIR="${{ runner.temp }}/ws_soak_${{ github.run_id }}"
          mkdir -p "$OUT_DIR"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          echo "Using OUT_DIR=$OUT_DIR"

      - name: Build and run shadow soak
        shell: bash
        env:
          DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '90' }}
          LIGHTER_PING_INTERVAL_MS: ${{ github.event.inputs.lighter_ping_interval_ms || '10000' }}
          EXTENDED_WS_READ_TIMEOUT_MS: ${{ github.event.inputs.extended_ws_read_timeout_ms || '45000' }}
          PARADEX_PUBLIC_FEED: ${{ github.event.inputs.paradex_public_feed || 'bbo' }}
          EXTENDED_WS_DEPTH_LEVELS: ${{ github.event.inputs.extended_ws_depth_levels || '2' }}
          HL_TS_HARDENING: ${{ github.event.inputs.hl_ts_hardening || '0' }}
          HL_TS_MAX_PAST_SKEW_MS: ${{ github.event.inputs.hl_ts_max_past_skew_ms || '1500' }}
          HL_TS_MAX_FUTURE_SKEW_MS: ${{ github.event.inputs.hl_ts_max_future_skew_ms || '250' }}
          ARB_EXTENDED_MAX_APPLY_AGE_MS: ${{ github.event.inputs.arb_extended_max_apply_age_ms || '' }}
          CONNECTORS: ${{ github.event.inputs.connectors || 'hyperliquid,lighter,extended,aster,paradex' }}
        run: |
          set -o pipefail
          set +e
          echo "RUN_INPUT DURATION_MINUTES=$DURATION_MINUTES"
          echo "RUN_INPUT HL_L2_LEVELS=${HL_L2_LEVELS:-}"
          echo "RUN_INPUT PARAPHINA_HL_TS_HARDENING=${HL_TS_HARDENING:-}"
          echo "RUN_INPUT PARAPHINA_HL_TS_MAX_PAST_SKEW_MS=${HL_TS_MAX_PAST_SKEW_MS:-}"
          echo "RUN_INPUT PARAPHINA_HL_TS_MAX_FUTURE_SKEW_MS=${HL_TS_MAX_FUTURE_SKEW_MS:-}"
          echo "RUN_INPUT PARADEX_PUBLIC_FEED=$PARADEX_PUBLIC_FEED"
          echo "RUN_INPUT EXTENDED_WS_DEPTH_LEVELS=$EXTENDED_WS_DEPTH_LEVELS"
          echo "RUN_INPUT PARAPHINA_EXTENDED_APPLY_AGE_ON_ANY_L2=${PARAPHINA_EXTENDED_APPLY_AGE_ON_ANY_L2:-}"
          if [ -n "${ARB_EXTENDED_MAX_APPLY_AGE_MS:-}" ]; then
            export PARAPHINA_ARB_EXTENDED_MAX_APPLY_AGE_MS="$ARB_EXTENDED_MAX_APPLY_AGE_MS"
            echo "RUN_INPUT PARAPHINA_ARB_EXTENDED_MAX_APPLY_AGE_MS=$PARAPHINA_ARB_EXTENDED_MAX_APPLY_AGE_MS"
          fi
          PARAPHINA_LIVE_MODE=1 \
          PARAPHINA_LIVE_PREFLIGHT_OK=1 \
          PARAPHINA_WS_AUDIT=1 \
          PARAPHINA_MARKET_RX_STATS=1 \
          PARAPHINA_MARKET_RX_STATS_PATH="$OUT_DIR/market_rx_stats.log" \
          PARAPHINA_TELEMETRY_MODE=jsonl \
          PARAPHINA_TELEMETRY_PATH="$OUT_DIR/telemetry.jsonl" \
          PARAPHINA_LIGHTER_WS_READONLY=1 \
          PARAPHINA_LIGHTER_PING_INTERVAL_MS=$LIGHTER_PING_INTERVAL_MS \
          PARAPHINA_EXTENDED_WS_READ_TIMEOUT_MS=$EXTENDED_WS_READ_TIMEOUT_MS \
          PARAPHINA_PARADEX_PUBLIC_FEED=$PARADEX_PUBLIC_FEED \
          PARAPHINA_EXTENDED_WS_DEPTH_LEVELS=$EXTENDED_WS_DEPTH_LEVELS \
          PARAPHINA_HL_TS_HARDENING=$HL_TS_HARDENING \
          PARAPHINA_HL_TS_MAX_PAST_SKEW_MS=$HL_TS_MAX_PAST_SKEW_MS \
          PARAPHINA_HL_TS_MAX_FUTURE_SKEW_MS=$HL_TS_MAX_FUTURE_SKEW_MS \
          timeout ${DURATION_MINUTES}m cargo run --release -p paraphina --bin paraphina_live --features "live_hyperliquid live_lighter live_extended live_aster live_paradex" -- \
            --trade-mode shadow \
            --connectors $CONNECTORS \
            --out-dir "$OUT_DIR" \
            2>&1 | tee "$OUT_DIR/run.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "shadow soak failed rc=$rc"
            exit "$rc"
          fi

      - name: Generate soak report
        if: always()
        shell: bash
        env:
          EXPECTED_CONNECTORS: ${{ github.event.inputs.connectors || 'hyperliquid,lighter,extended,aster,paradex' }}
        run: |
          set -o pipefail
          python3 tools/ws_soak_report.py --out-dir "$OUT_DIR" --gate --expected-connectors "$EXPECTED_CONNECTORS" | tee "$OUT_DIR/ws_soak_report.stdout"

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws_shadow_soak_${{ github.run_id }}
          path: ${{ runner.temp }}/ws_soak_${{ github.run_id }}/*
          if-no-files-found: warn

      - name: Log summary
        if: always()
        shell: bash
        run: |
          ls -la "$OUT_DIR"
          if [ -f "$OUT_DIR/ws_soak_report.md" ]; then
            head -n 80 "$OUT_DIR/ws_soak_report.md"
          else
            echo "ws_soak_report.md not present"
          fi
