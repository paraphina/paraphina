# Paraphina ETH Aster passive maker micro-canary profile.
# Keep the live path real, but make Aster the only intended fill venue and keep
# inventory/open-order risk tightly bounded.

[venue]
base_order_size = 0.01
max_order_size = 0.01

[limits]
max_position_tao = 0.03
max_gross_position_tao = 0.05
max_abs_venue_position_tao = 0.03
soft_max_position_tao = 0.015
soft_max_gross_position_tao = 0.02
soft_max_abs_venue_position_tao = 0.015
max_open_orders = 4

[rate_limit]
enabled = true
rps = 3.0
burst = 4

[enforcement]
post_only = true
reduce_only = false

[kill]
stale_max_ticks = 4
