# V2 ranked-admission live micro-canary profile.
# Use only with PARAPHINA_V2_DECISION_MODE=live_canary_admission and
# PARAPHINA_V2_LIVE_CANARY_ADMISSION_APPROVED=true.

[venue]
# ETH minimum observed in the Lighter order-books surface is 0.0050.
# The 0.009 cap stays inside the 0.02 venue exposure hard cap for the
# current one-order canary gate while leaving room for live size shrink.
base_order_size = 0.009
max_order_size = 0.009
lot_size_tao = 0.005

[limits]
max_position_tao = 0.05
max_gross_position_tao = 0.05
max_abs_venue_position_tao = 0.02
soft_max_position_tao = 0.03
soft_max_gross_position_tao = 0.03
soft_max_abs_venue_position_tao = 0.01
max_open_orders = 1

[rate_limit]
enabled = true
rps = 4.0
burst = 6

[enforcement]
post_only = true
reduce_only = false

[kill]
stale_max_ticks = 4

[book]
max_mid_jump_pct = 0.03
