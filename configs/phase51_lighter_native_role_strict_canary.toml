# Phase 5.1 Lighter native-role evidence canary profile.
# Use only with --connectors lighter and the Phase 5.1 strict native-role env gates.

[venue]
base_order_size = 0.01
max_order_size = 0.01

[limits]
max_position_tao = 0.05
max_open_orders = 1

[rate_limit]
enabled = true
rps = 4.0
burst = 6

[enforcement]
post_only = true
reduce_only = false

[kill]
stale_max_ticks = 4

[book]
# Narrowly avoid single-venue fair-value bootstrap dev-breach during the
# strict Phase 5.1 native-role evidence canary. Order safety remains enforced
# by Lighter-only, max_open_orders=1, post_only=true, and replacements disabled.
max_mid_jump_pct = 0.03
